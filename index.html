<!doctype html>
<html lang="th">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Admin - Tournament</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

<header>

  <div class="brand">
    🔐 ADMIN
  </div>

  <div class="sub">
    จัดการการสมัครและตรวจสอบสลิป
  </div>

</header>


<main>

  <!-- LOGIN -->

  <section id="login" class="card">

    <h2>
      เข้าสู่ระบบ Admin
    </h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button onclick="login()">
      เข้าสู่ระบบ
    </button>

    <p id="loginMsg"></p>

  </section>


  <!-- ADMIN PANEL -->

  <section
    id="panel"
    class="hidden"
  >


    <!-- DATE -->

    <div class="card">

      <div
        style="
          display:flex;
          gap:10px;
          align-items:end;
          flex-wrap:wrap;
        "
      >

        <div>

          <label for="adminDate">
            วันที่แข่งขัน
          </label>

          <input
            id="adminDate"
            type="date"
          >

        </div>


        <button onclick="loadAdmin()">
          🔄 รีเฟรช
        </button>


        <button onclick="logout()">
          ออกจากระบบ
        </button>

      </div>

    </div>


    <!-- SLOT COUNTS -->

    <div class="stats">

      <button
        class="time-btn active"
        id="timeBtn1300"
        onclick="selectTime('13:00')"
      >
        13:00
        <b id="s1300">0/8</b>
      </button>


      <button
        class="time-btn"
        id="timeBtn1500"
        onclick="selectTime('15:00')"
      >
        15:00
        <b id="s1500">0/8</b>
      </button>


      <button
        class="time-btn"
        id="timeBtn1700"
        onclick="selectTime('17:00')"
      >
        17:00
        <b id="s1700">0/8</b>
      </button>


      <button
        class="time-btn"
        id="timeBtn1900"
        onclick="selectTime('19:00')"
      >
        19:00
        <b id="s1900">0/8</b>
      </button>


      <button
        class="time-btn"
        id="timeBtn2100"
        onclick="selectTime('21:00')"
      >
        21:00
        <b id="s2100">0/8</b>
      </button>


      <button
        class="time-btn"
        id="timeBtn2300"
        onclick="selectTime('23:00')"
      >
        23:00
        <b id="s2300">0/8</b>
      </button>


      <button
        class="time-btn"
        id="timeBtn0100"
        onclick="selectTime('01:00')"
      >
        01:00
        <b id="s0100">0/8</b>
      </button>

    </div>


    <!-- CURRENT SLOT -->

    <div class="card">

      <h2 id="selectedTimeTitle">
        รายการรอตรวจสอบ • 13:00
      </h2>

      <p id="pendingInfo">
        รายการที่รอ Admin ตรวจสอบสลิป
      </p>

    </div>


    <!-- APPLICATION LIST -->

    <div id="list"></div>


  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="admin.js"></script>


</body>

</html>
